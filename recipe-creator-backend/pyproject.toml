[project]
name = "recipe-creator-backend"
version = "0.1.0"
description = "Recipe Creator API and durable persistence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "surrealdb-orm==0.33.1",
  "pydantic-settings==2.15.0",
  "pydantic-ai-slim[openai]==2.40.0",
  "pillow==12.3.0",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_creator"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "recipe_creator/migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a real SurrealDB 3.2.4 server"]
